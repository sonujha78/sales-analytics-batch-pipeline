networks:
  pipeline-net:
    name: pipeline-net
    driver: bridge

volumes:
  airflow_postgres_data:
  mysql_data:
  hive_metastore_pg:
  namenode_data:
  hadoop_historyserver:

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: unless-stopped
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - namenode_data:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=sales-analytics-cluster
    env_file:
      - ./hadoop-config/hadoop.env
    networks:
      - pipeline-net

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    restart: unless-stopped
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file:
      - ./hadoop-config/hadoop.env
    networks:
      - pipeline-net

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file:
      - ./hadoop-config/hadoop.env
    networks:
      - pipeline-net

  nodemanager1:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager1
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/nodemanager-entrypoint.sh"]
    volumes:
      - ./hadoop-config/nodemanager-entrypoint.sh:/nodemanager-entrypoint.sh
    ports:
      - "8042:8042"
    environment:
      - SERVICE_PRECONDITION=namenode:9870 resourcemanager:8088
    env_file:
      - ./hadoop-config/hadoop.env
    networks:
      - pipeline-net

  historyserver:
    image: bde2020/hadoop-historyserver:2.0.0-hadoop3.2.1-java8
    container_name: historyserver
    restart: unless-stopped
    ports:
      - "8188:8188"
    volumes:
      - hadoop_historyserver:/hadoop/yarn/timeline
    environment:
      - SERVICE_PRECONDITION=namenode:9870 resourcemanager:8088
    env_file:
      - ./hadoop-config/hadoop.env
    networks:
      - pipeline-net

  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: hive-metastore-postgresql
    restart: unless-stopped
    volumes:
      - hive_metastore_pg:/var/lib/postgresql/data
    networks:
      - pipeline-net

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    restart: unless-stopped
    env_file:
      - ./hadoop-config/hadoop.env
    command: /opt/hive/bin/hive --service metastore
    environment:
      - SERVICE_PRECONDITION=namenode:9870 datanode:9864 hive-metastore-postgresql:5432
    ports:
      - "9083:9083"
    depends_on:
      - hive-metastore-postgresql
    networks:
      - pipeline-net

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    restart: unless-stopped
    env_file:
      - ./hadoop-config/hadoop.env
    environment:
      - SERVICE_PRECONDITION=hive-metastore:9083
      - HIVE_SITE_CONF_hive_metastore_uris=thrift://hive-metastore:9083
    ports:
      - "10000:10000"
      - "10002:10002"
    depends_on:
      - hive-metastore
    networks:
      - pipeline-net

  mysql:
    image: mysql:8.0
    container_name: mysql-operational
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=operational
      - MYSQL_USER=sqoopuser
      - MYSQL_PASSWORD=sqooppass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - pipeline-net

  sqoop-client:
    image: sales-pipeline/sqoop-client:latest
    container_name: sqoop-client
    restart: unless-stopped
    env_file:
      - ./hadoop-config/hadoop.env
    volumes:
      - ./sqoop/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./sqoop/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./sqoop/conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml
      - ./sqoop/conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
    networks:
      - pipeline-net

  spark-client:
    image: sales-pipeline/spark-client:latest
    container_name: spark-client
    restart: unless-stopped
    env_file:
      - ./hadoop-config/hadoop.env
    volumes:
      - ./sqoop/conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./sqoop/conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml
      - ./sqoop/conf/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml
      - ./sqoop/conf/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml
      - ./spark-jobs:/opt/spark-jobs
    networks:
      - pipeline-net

  airflow-postgres:
    image: postgres:13
    container_name: airflow-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    networks:
      - pipeline-net

  airflow-init:
    image: apache/airflow:2.7.3-python3.10
    container_name: airflow-init
    depends_on:
      - airflow-postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    entrypoint: /bin/bash
    command: -c "airflow db init && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
    networks:
      - pipeline-net

  airflow-webserver:
    image: apache/airflow:2.7.3-python3.10
    container_name: airflow-webserver
    restart: unless-stopped
    depends_on:
      - airflow-postgres
      - airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./hadoop-config/hadoop.env:/opt/hadoop.env
    ports:
      - "8090:8080"
    command: webserver
    networks:
      - pipeline-net

  airflow-scheduler:
    image: apache/airflow:2.7.3-python3.10
    container_name: airflow-scheduler
    restart: unless-stopped
    depends_on:
      - airflow-postgres
      - airflow-init
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    command: scheduler
    networks:
      - pipeline-net
