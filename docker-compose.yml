networks:
  pipeline-net:
    name: pipeline-net
    driver: bridge

volumes:
  mysql_data:
  hive_metastore_pg:
  namenode_data:
  hadoop_historyserver:

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: unless-stopped
    ports:
      - "9870:9870"
      - "8020:8020"
    volumes:
      - namenode_data:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=sales-analytics-cluster
    env_file:
      - ./hadoop-config/hadoop.env
    networks:
      - pipeline-net

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    restart: unless-stopped
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file:
      - ./hadoop-config/hadoop.env
    networks:
      - pipeline-net

  resourcemanager:
    image: bde2020/hadoop-resourcemanager:2.0.0-hadoop3.2.1-java8
    container_name: resourcemanager
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file:
      - ./hadoop-config/hadoop.env
    networks:
      - pipeline-net

  nodemanager1:
    image: bde2020/hadoop-nodemanager:2.0.0-hadoop3.2.1-java8
    container_name: nodemanager1
    restart: unless-stopped
    ports:
      - "8042:8042"
    environment:
      - SERVICE_PRECONDITION=namenode:9870 resourcemanager:8088
    env_file:
      - ./hadoop-config/hadoop.env
    networks:
      - pipeline-net

  historyserver:
    image: bde2020/hadoop-historyserver:2.0.0-hadoop3.2.1-java8
    container_name: historyserver
    restart: unless-stopped
    ports:
      - "8188:8188"
    volumes:
      - hadoop_historyserver:/hadoop/yarn/timeline
    environment:
      - SERVICE_PRECONDITION=namenode:9870 resourcemanager:8088
    env_file:
      - ./hadoop-config/hadoop.env
    networks:
      - pipeline-net

  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: hive-metastore-postgresql
    restart: unless-stopped
    volumes:
      - hive_metastore_pg:/var/lib/postgresql/data
    networks:
      - pipeline-net

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    restart: unless-stopped
    env_file:
      - ./hadoop-config/hadoop.env
    command: /opt/hive/bin/hive --service metastore
    environment:
      - SERVICE_PRECONDITION=namenode:9870 datanode:9864 hive-metastore-postgresql:5432
    ports:
      - "9083:9083"
    depends_on:
      - hive-metastore-postgresql
    networks:
      - pipeline-net

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    restart: unless-stopped
    env_file:
      - ./hadoop-config/hadoop.env
    environment:
      - SERVICE_PRECONDITION=hive-metastore:9083
      - HIVE_SITE_CONF_hive_metastore_uris=thrift://hive-metastore:9083
    ports:
      - "10000:10000"
      - "10002:10002"
    depends_on:
      - hive-metastore
    networks:
      - pipeline-net

  mysql:
    image: mysql:8.0
    container_name: mysql-operational
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=operational
      - MYSQL_USER=sqoopuser
      - MYSQL_PASSWORD=sqooppass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - pipeline-net
